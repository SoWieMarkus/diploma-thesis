[project]
name = "gaze-estimator"
version = "2.0.0"
description = "Gaze estimation of cyclists to measure smartphone distraction (diploma thesis, PrioBike Hamburg)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "Markus Wieland" }]
dependencies = [
  "fastapi>=0.116",
  "matplotlib>=3.10",
  "mediapipe>=0.10.21",
  "numpy>=1.26,<2",
  "opencv-python>=4.11",
  "pandas>=2.2",
  "pyyaml>=6.0",
  "scikit-learn>=1.6",
  "sqlmodel>=0.0.24",
  "timm>=1.0",
  "torch>=2.7",
  "torchvision>=0.22",
  "tqdm>=4.67",
  "uvicorn>=0.35",
]

[project.optional-dependencies]
# dlib has no wheels for most platforms and is compiled from source (needs CMake + a C++ compiler).
# It is optional so the CI and quick setups do not have to build it.
dlib = ["dlib>=19.24"]
# Pick exactly one torch backend: `uv sync --extra cpu` or `uv sync --extra cuda`.
# `cuda` is the regular PyPI build, which ships CUDA on Linux (and is CPU-only on Windows/macOS).
# It deliberately avoids a CUDA-specific index like download.pytorch.org/whl/cu128, because those
# stop receiving new torch versions after a few releases.
cpu = ["torch>=2.7", "torchvision>=0.22"]
cuda = ["torch>=2.7", "torchvision>=0.22"]

[project.scripts]
gaze-demo = "gaze_estimator.cli.demo:main"
gaze-process = "gaze_estimator.cli.process:main"
gaze-evaluate = "gaze_estimator.cli.evaluate:main"
gaze-serve = "gaze_estimator.cli.serve:main"
gaze-download-assets = "gaze_estimator.cli.download_assets:main"

[dependency-groups]
dev = ["pytest>=8.4", "ruff>=0.12", "httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gaze_estimator"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cuda" }]]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", extra = "cpu" }]
torchvision = [{ index = "pytorch-cpu", extra = "cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["thesis", "web"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
