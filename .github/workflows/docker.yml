name: Docker Test

on:
  pull_request:
    branches:
      - "*"

jobs:
  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: diploma:test

      - name: Test Docker image can start
        run: |
          # Test that the image can start and show help
          docker run --rm diploma:test || echo "Expected exit code 1 for no arguments"

          # Test that entrypoint script works
          docker run --rm diploma:test main --help || echo "Testing main command"

      - name: Test image size
        run: |
          # Get image size and output for monitoring
          docker images diploma:test --format "table {{.Repository}}\t{{.Tag}}\t{{.Size}}"