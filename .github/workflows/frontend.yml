name: Frontend Tests

on:
  push:
    branches:
      - "main"
    paths:
      - 'visualizer/**'
  pull_request:
    branches:
      - "*"
    paths:
      - 'visualizer/**'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./visualizer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install dependencies
        run: npm install

      - name: Build the project
        run: npm run build

      - name: Run Biome CI check
        run: npx @biomejs/biome ci